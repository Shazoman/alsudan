name: alsudan
description: "Alsudan digital services app."
publish_to: 'none'
version: 1.0.0+36

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_contacts: ^2.1.0
  shared_preferences: ^2.5.5
  local_auth: ^2.3.0
  flutter_native_contact_picker: ^0.0.11
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  pdf: ^3.11.1
  printing: ^5.14.3
  crypto: ^3.0.6
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/providers/
